name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Add INTERNET permission
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$FILE"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$FILE"
          fi

      # ✅ Gradle ডিস্ট্রিবিউশন ক্যাশ করা (পুনরায় ডাউনলোড এড়াতে)
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ flutter create-এর পরে wrapper ফাইলটি সরাসরি downloads.gradle.org ব্যবহার করতে বাধ্য করা
      - name: Force direct Gradle distribution URL (no GitHub redirect)
        run: |
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          mkdir -p $(dirname "$WRAPPER")
          cat > "$WRAPPER" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://downloads.gradle.org/distributions/gradle-9.3.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          EOF
          echo "----- Wrapper file content -----"
          cat "$WRAPPER"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hridoys-toolbox-apk
          path: build/app/outputs/flutter-apk/app-release.apk

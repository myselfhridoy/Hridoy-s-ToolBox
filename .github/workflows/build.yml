name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Add INTERNET permission
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$FILE"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$FILE"
          fi

      # ✅ ধাপ ১: Gradle wrapper মিরর (Tencent)
      - name: Set Gradle distribution mirror
        run: |
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          mkdir -p $(dirname "$WRAPPER")
          cat > "$WRAPPER" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          EOF

      # ✅ ধাপ ২: Maven মিরর (Aliyun) — build.gradle.kts-এ ইনজেক্ট
      - name: Inject Aliyun Maven mirrors
        run: |
          ROOT_GRADLE=android/build.gradle.kts
          APP_GRADLE=android/app/build.gradle.kts

          # রুট build.gradle.kts-এ allprojects repositories যোগ
          if ! grep -q 'maven.aliyun.com' "$ROOT_GRADLE"; then
            python3 -c "
          import re
          p = '$ROOT_GRADLE'
          s = open(p).read()
          inject = '''allprojects {
              repositories {
                  maven { url = uri(\"https://maven.aliyun.com/repository/public\") }
                  maven { url = uri(\"https://maven.aliyun.com/repository/google\") }
                  maven { url = uri(\"https://maven.aliyun.com/repository/gradle-plugin\") }
                  maven { url = uri(\"https://maven.aliyun.com/repository/central\") }
                  google()
                  mavenCentral()
              }
          }
          '''
          s = inject + s
          open(p, 'w').write(s)
          "
          fi

          # অ্যাপ build.gradle.kts-এ ও একইভাবে
          if ! grep -q 'maven.aliyun.com' "$APP_GRADLE"; then
            python3 -c "
          p = '$APP_GRADLE'
          s = open(p).read()
          inject = '''allprojects {
              repositories {
                  maven { url = uri(\"https://maven.aliyun.com/repository/public\") }
                  maven { url = uri(\"https://maven.aliyun.com/repository/google\") }
                  maven { url = uri(\"https://maven.aliyun.com/repository/gradle-plugin\") }
                  maven { url = uri(\"https://maven.aliyun.com/repository/central\") }
                  google()
                  mavenCentral()
              }
          }
          '''
          s = inject + s
          open(p, 'w').write(s)
          "
          fi

          echo '----- android/build.gradle.kts (head) -----'
          head -20 "$ROOT_GRADLE"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hridoys-toolbox-apk
          path: build/app/outputs/flutter-apk/app-release.apk

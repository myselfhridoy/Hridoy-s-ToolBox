name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Add INTERNET permission
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$FILE"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$FILE"
          fi

      - name: Overwrite Gradle wrapper URL (avoid 504 on GitHub Releases)
        run: |
          WRAPPER_DIR=android/gradle/wrapper
          mkdir -p "$WRAPPER_DIR"
          cat > "$WRAPPER_DIR/gradle-wrapper.properties" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://downloads.gradle.org/distributions/gradle-9.3.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          EOF
          echo "----- Updated gradle-wrapper.properties -----"
          cat "$WRAPPER_DIR/gradle-wrapper.properties"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hridoys-toolbox-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Add INTERNET permission
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$FILE"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$FILE"
          fi

      # ✅ ধাপ ১: Gradle ডিস্ট্রিবিউশন ক্যাশ করা (৫০৪ এরর এড়াতে)
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ ধাপ ২: flutter create-এর পরে wrapper ফাইলটি জোরপূর্বক আপডেট করা
      - name: Force correct Gradle distribution URL
        run: |
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          mkdir -p $(dirname "$WRAPPER")
          cat > "$WRAPPER" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          EOF
          echo "----- Wrapper file content -----"
          cat "$WRAPPER"

      - name: Install dependencies
        run: flutter pub get

      # ✅ ধাপ ৩: Gradle ডাউনলোডে সমস্যা হলে পুনরায় চেষ্টা করার জন্য retry যোগ করা
      - name: Build release APK (with retry)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            if flutter build apk --release; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 10 seconds..."
            sleep 10
          done
          echo "All attempts failed."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hridoys-toolbox-apk
          path: build/app/outputs/flutter-apk/app-release.apk

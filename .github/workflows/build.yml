name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Add INTERNET permission to AndroidManifest
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if grep -q 'android.permission.INTERNET' "$FILE"; then
            echo "INTERNET permission already present"
          else
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$FILE"
            echo "INTERNET permission added"
          fi
          echo "----- android/app/src/main/AndroidManifest.xml -----"
          head -20 "$FILE"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hridoys-toolbox-apk
          path: build/app/outputs/flutter-apk/app-release.apk

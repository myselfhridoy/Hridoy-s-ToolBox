name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Add INTERNET permission
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$FILE"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$FILE"
          fi

      # ✅ Gradle distribution mirror
      - name: Set Gradle distribution mirror
        run: |
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          mkdir -p $(dirname "$WRAPPER")
          cat > "$WRAPPER" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          EOF

      # ✅ settings.gradle.kts — মিরর ও include(":app") সহ
      - name: Configure settings.gradle.kts
        run: |
          SETTINGS=android/settings.gradle.kts
          cat > "$SETTINGS" <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = uri("https://maven.aliyun.com/repository/public") }
                  maven { url = uri("https://maven.aliyun.com/repository/google") }
                  maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                  maven { url = uri("https://maven.aliyun.com/repository/central") }
                  maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  maven { url = uri("https://maven.aliyun.com/repository/public") }
                  maven { url = uri("https://maven.aliyun.com/repository/google") }
                  maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                  maven { url = uri("https://maven.aliyun.com/repository/central") }
                  maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
                  google()
                  mavenCentral()
              }
          }

          include(":app")
          rootProject.name = "hridoys_toolbox"
          EOF
          echo "----- settings.gradle.kts updated -----"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hridoys-toolbox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
